[project]
name = "teardown-agent-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["gymnasium>=1.0", "numpy>=1.26", "stable-baselines3>=2.3"]

[project.optional-dependencies]
gui = ["pyautogui>=0.9", "python-xlib>=0.33", "mss>=9", "pillow>=10", "evdev>=1.7"]
train = ["torch>=2.7,<2.8"]

[dependency-groups]
dev = ["pytest>=8"]

# CUDA 12.6 wheels. The driver here is 565, which speaks CUDA 12.7, so the CUDA 13
# wheels torch now ships by default refuse to initialise ("driver too old"). Pin the
# cu126 index instead of letting the default resolve. The VLA/world-model baselines are
# 4-5B parameter models - CPU inference is not viable for them, unlike the small student
# CNN. Revisit after the 24.04 upgrade brings driver >= 570.
[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
addopts = "-m 'not game'"
markers = ["game: requires the live game on an X display"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/teardown_lab"]
